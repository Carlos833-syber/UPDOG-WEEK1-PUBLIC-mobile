name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      HXCPP_COMPILE_THREADS: 2
      ANDROID_HOST: linux-x86_64
      HXCPP_STRIP: llvm-strip
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.2.9519653'
      - name: Install project libraries
        run: |
          haxelib --global install hxpkg 1.6.2 --quiet
          haxelib --global run hxpkg install --quiet
          haxelib list
      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/25.2.9519653"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
      - name: Prepare packaged assets
        run: |
          python3 -m unittest discover -s tests -p 'test_android_assets.py'
          python3 scripts/prepare-android-assets.py
      - name: Verify packaged asset IDs
        run: |
          haxelib run lime update android -release
          haxe -cp tests --run CheckAndroidAssets
      - name: Build ARM64 APK
        run: haxelib run lime build android -release
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: UPDOG-Android-arm64
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
